---
layout: base
---
<main class="page">
  <header class="page-header">
    <div class="container">
      <p class="eyebrow">{{ page.eyebrow | default: page.title }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
    </div>
  </header>
  <section class="page-body">
    <div class="container">
      {{ content }}
    </div>
  </section>
</main>
